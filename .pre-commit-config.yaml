# Local mirror of the checks that the GitLab `lint` and `security` stages run.
# Catching these before the commit is cheaper than catching them in CI, and it
# is the only thing that reliably keeps a secret out of git history entirely.
#
# Setup:  pip install pre-commit && pre-commit install
# Refresh pinned versions:  pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(cmd|bat)$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=5120]
        # Evidence screenshots and recordings are expected to be large.
        exclude: ^evidence/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yml]
