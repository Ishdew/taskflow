# TaskFlow configuration.
#
# Every value that differs between environments is read from an environment variable (12-factor
# config). The defaults below exist so that `docker compose up` gives a working local instance with
# no setup; they are local development values and are never used in AWS. In ECS, Terraform injects
# the real host, database name and credentials into the task definition, with the credentials coming
# from Secrets Manager rather than from `environment` entries.

spring:
  application:
    name: taskflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow_local}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      # Recycle connections well before RDS or the NAT gateway would drop an idle one underneath us.
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}

  jpa:
    hibernate:
      # Flyway owns the schema. `validate` turns a mismatch between the entity and the migrations
      # into a startup failure instead of an unnoticed production data problem.
      ddl-auto: validate
    # Without this, a database connection is held open for the whole request including response
    # rendering, which quietly inflates the pool size the service needs.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  lifecycle:
    # How long the container may spend draining before shutdown is forced. Must stay comfortably
    # below the ECS stopTimeout, or ECS will SIGKILL mid-drain and undo the graceful shutdown.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}

server:
  port: ${SERVER_PORT:8080}
  # Stop accepting new connections, let in-flight requests finish, then close the pool. This is what
  # keeps ECS rolling deployments and vertical-scaling redeployments from dropping traffic.
  shutdown: graceful
  error:
    # Errors are returned as RFC 7807 documents by GlobalExceptionHandler. Suppress the servlet
    # container's own error attributes so nothing leaks through the fallback path either.
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      # Serves the health endpoint at /health rather than /actuator/health, which is the path the
      # ALB target group and the ECS container health check both use.
      base-path: /
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # Never expose component detail publicly: the ALB health check reaches this endpoint from the
      # internet-facing listener, and details would disclose internal hostnames.
      show-details: ${HEALTH_SHOW_DETAILS:never}
      show-components: ${HEALTH_SHOW_COMPONENTS:never}
      group:
        # Readiness gates traffic, so it must fail when the database is unreachable.
        readiness:
          include: readinessState,db
        # Liveness deliberately excludes the database. If it did not, a brief RDS outage would fail
        # every container's health check at once and ECS would kill and restart the entire service
        # while the database was already struggling.
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    environment: ${APP_ENVIRONMENT:local}

logging:
  structured:
    format:
      # JSON on stdout, so the CloudWatch agent ships parseable events rather than opaque text.
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${APP_ENVIRONMENT:local}
  level:
    root: ${LOG_LEVEL:INFO}
    com.taskflow: ${APP_LOG_LEVEL:INFO}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
