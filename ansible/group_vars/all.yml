---
# Shared defaults. Set the S3 bucket before the first run:
#   ansible-playbook site.yml -e ssm_s3_bucket=taskflow-tfstate-YOUR_ACCOUNT_ID
# Or copy all.yml.example → edit ssm_s3_bucket and merge values here.

ansible_connection: aws_ssm
ansible_aws_ssm_region: "{{ aws_region }}"
ansible_aws_ssm_bucket_name: "{{ ssm_s3_bucket }}"
ansible_aws_ssm_timeout: 300
ansible_python_interpreter: /usr/bin/python3

aws_region: ap-south-1
project_name: taskflow
ecs_cluster_name: taskflow-prod-cluster
cloudwatch_log_group: /ecs/taskflow-prod
vpc_cidr: 10.0.0.0/16

# SSM is how we reach private hosts. This CIDR is only for the host firewall.
ssh_allowed_cidrs:
  - 10.0.0.0/16
