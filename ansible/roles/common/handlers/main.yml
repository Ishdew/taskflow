---
- name: Restart dnf-automatic
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    state: restarted

- name: Reload sshd
  ansible.builtin.systemd:
    name: sshd
    state: reloaded

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Restart ecs
  ansible.builtin.systemd:
    name: ecs
    state: restarted
