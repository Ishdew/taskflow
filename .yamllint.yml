---
extends: default

ignore: |
  .terraform/
  target/
  evidence/
  # Springdoc-generated; sequence indent differs from Ansible playbooks.
  docs/openapi.yaml

rules:
  # CI job definitions and Ansible tasks routinely exceed 80 columns; wrapping
  # them hurts readability more than the long line does.
  line-length:
    max: 160
    level: warning
  document-start: disable
  # Ansible indents list items; some other YAML files do not — allow both.
  indentation:
    spaces: 2
    indent-sequences: consistent
  comments:
    min-spaces-from-content: 1
  truthy:
    # GitLab CI and GitHub Actions both use bare `on:`-style keys.
    allowed-values: ["true", "false"]
    check-keys: false
